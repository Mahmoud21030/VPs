name: Copy Base Image to Oracle

on:
  workflow_dispatch:
    inputs:
      object_prefix:
        description: Object prefix containing the base image
        required: false
        default: windows-vm
        type: string

concurrency:
  group: copy-base-image-to-oracle
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}

      ORACLE_BUCKET: ${{ secrets.ORACLE_BUCKET }}
      ORACLE_NAMESPACE: ${{ secrets.ORACLE_NAMESPACE }}
      ORACLE_REGION: ${{ secrets.ORACLE_REGION }}
      ORACLE_ACCESS_KEY_ID: ${{ secrets.ORACLE_ACCESS_KEY_ID }}
      ORACLE_SECRET_ACCESS_KEY: ${{ secrets.ORACLE_SECRET_ACCESS_KEY }}
      ORACLE_ENDPOINT_OVERRIDE: ${{ secrets.ORACLE_ENDPOINT }}

      OBJECT_PREFIX: ${{ inputs.object_prefix }}

    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          required_vars=(
            B2_BUCKET
            B2_ENDPOINT
            B2_KEY_ID
            B2_APPLICATION_KEY
            ORACLE_BUCKET
            ORACLE_NAMESPACE
            ORACLE_REGION
            ORACLE_ACCESS_KEY_ID
            ORACLE_SECRET_ACCESS_KEY
            OBJECT_PREFIX
          )

          for name in "${required_vars[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required value: ${name}"
              exit 1
            fi
          done

          if [[ -n "${ORACLE_ENDPOINT_OVERRIDE:-}" ]]; then
            ORACLE_ENDPOINT="${ORACLE_ENDPOINT_OVERRIDE}"
          else
            ORACLE_ENDPOINT="https://${ORACLE_NAMESPACE}.compat.objectstorage.${ORACLE_REGION}.oraclecloud.com"
          fi

          case "$B2_ENDPOINT" in
            http://*|https://*) ;;
            *)
              echo "::error::B2_ENDPOINT must start with http:// or https://"
              exit 1
              ;;
          esac

          case "$ORACLE_ENDPOINT" in
            http://*|https://*) ;;
            *)
              echo "::error::ORACLE_ENDPOINT must start with http:// or https://"
              exit 1
              ;;
          esac

          echo "ORACLE_ENDPOINT=${ORACLE_ENDPOINT}" >> "$GITHUB_ENV"

          echo "Source:      s3://${B2_BUCKET}/${OBJECT_PREFIX}/base.qcow2"
          echo "Destination: s3://${ORACLE_BUCKET}/${OBJECT_PREFIX}/base.qcow2"
          echo "Oracle endpoint: ${ORACLE_ENDPOINT}"

      - name: Install AWS CLI v2
        shell: bash
        run: |
          set -Eeuo pipefail

          if command -v aws >/dev/null 2>&1; then
            aws --version
            exit 0
          fi

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" \
            --output "${tmp_dir}/awscliv2.zip"

          unzip -q "${tmp_dir}/awscliv2.zip" -d "$tmp_dir"
          sudo "${tmp_dir}/aws/install"

          aws --version

      - name: Configure S3-compatible addressing
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$RUNNER_TEMP/aws"

          cat > "$RUNNER_TEMP/aws/config" <<'EOF'
          [default]
          region = us-east-1
          request_checksum_calculation = when_required
          response_checksum_validation = when_required
          s3 =
            addressing_style = path
            signature_version = s3v4
          EOF

          echo "AWS_CONFIG_FILE=$RUNNER_TEMP/aws/config" >> "$GITHUB_ENV"
          echo "AWS_EC2_METADATA_DISABLED=true" >> "$GITHUB_ENV"
          echo "AWS_REQUEST_CHECKSUM_CALCULATION=when_required" >> "$GITHUB_ENV"
          echo "AWS_RESPONSE_CHECKSUM_VALIDATION=when_required" >> "$GITHUB_ENV"

      - name: Download base image from Backblaze
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p work

          retry() {
            local max_attempts="$1"
            shift
            local delay=3
            local attempt

            for attempt in $(seq 1 "$max_attempts"); do
              if "$@"; then
                return 0
              fi

              if (( attempt == max_attempts )); then
                echo "::error::Command failed after ${max_attempts} attempts"
                return 1
              fi

              echo "Attempt ${attempt}/${max_attempts} failed; retrying in ${delay}s..."
              sleep "$delay"

              if (( delay < 48 )); then
                delay=$((delay * 2))
              fi
            done
          }

          b2_aws() {
            env \
              AWS_ACCESS_KEY_ID="$B2_KEY_ID" \
              AWS_SECRET_ACCESS_KEY="$B2_APPLICATION_KEY" \
              AWS_DEFAULT_REGION="us-east-1" \
              aws \
                --endpoint-url "$B2_ENDPOINT" \
                "$@"
          }

          retry 5 b2_aws \
            s3 cp \
            "s3://${B2_BUCKET}/${OBJECT_PREFIX}/base.qcow2" \
            "work/base.qcow2" \
            --only-show-errors

          retry 5 b2_aws \
            s3 cp \
            "s3://${B2_BUCKET}/${OBJECT_PREFIX}/base.sha256" \
            "work/base.sha256" \
            --only-show-errors

          if b2_aws \
            s3 cp \
            "s3://${B2_BUCKET}/${OBJECT_PREFIX}/base-manifest.json" \
            "work/base-manifest.json" \
            --only-show-errors; then
            echo "Downloaded optional base-manifest.json"
          else
            echo "::warning::base-manifest.json was not found; continuing without it"
          fi

          echo "Downloaded files:"
          ls -lh work/

      - name: Verify source SHA256
        shell: bash
        run: |
          set -Eeuo pipefail

          expected="$(awk 'NF {print $1; exit}' work/base.sha256 | tr '[:upper:]' '[:lower:]')"

          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid SHA256 value in work/base.sha256"
            exit 1
          fi

          actual="$(sha256sum work/base.qcow2 | awk '{print $1}')"

          echo "Expected SHA256: $expected"
          echo "Actual SHA256:   $actual"

          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Source base image SHA256 verification failed"
            exit 1
          fi

          printf '%s  %s\n' "$actual" "base.qcow2" > work/base.sha256.normalized
          mv work/base.sha256.normalized work/base.sha256

          echo "Source SHA256 verification passed"

      - name: Upload base image to Oracle Object Storage
        shell: bash
        run: |
          set -Eeuo pipefail

          retry() {
            local max_attempts="$1"
            shift
            local delay=3
            local attempt

            for attempt in $(seq 1 "$max_attempts"); do
              if "$@"; then
                return 0
              fi

              if (( attempt == max_attempts )); then
                echo "::error::Command failed after ${max_attempts} attempts"
                return 1
              fi

              echo "Attempt ${attempt}/${max_attempts} failed; retrying in ${delay}s..."
              sleep "$delay"

              if (( delay < 48 )); then
                delay=$((delay * 2))
              fi
            done
          }

          oracle_aws() {
            env \
              AWS_ACCESS_KEY_ID="$ORACLE_ACCESS_KEY_ID" \
              AWS_SECRET_ACCESS_KEY="$ORACLE_SECRET_ACCESS_KEY" \
              AWS_DEFAULT_REGION="$ORACLE_REGION" \
              AWS_REQUEST_CHECKSUM_CALCULATION="when_required" \
              AWS_RESPONSE_CHECKSUM_VALIDATION="when_required" \
              AWS_EC2_METADATA_DISABLED="true" \
              aws \
                --endpoint-url "$ORACLE_ENDPOINT" \
                "$@"
          }

          retry 5 oracle_aws \
            s3 cp \
            "work/base.qcow2" \
            "s3://${ORACLE_BUCKET}/${OBJECT_PREFIX}/base.qcow2" \
            --only-show-errors

          retry 5 oracle_aws \
            s3 cp \
            "work/base.sha256" \
            "s3://${ORACLE_BUCKET}/${OBJECT_PREFIX}/base.sha256" \
            --only-show-errors

          if [[ -f work/base-manifest.json ]]; then
            retry 5 oracle_aws \
              s3 cp \
              "work/base-manifest.json" \
              "s3://${ORACLE_BUCKET}/${OBJECT_PREFIX}/base-manifest.json" \
              --only-show-errors
          fi

          echo "Oracle upload completed"

      - name: Verify Oracle upload
        shell: bash
        run: |
          set -Eeuo pipefail

          oracle_aws() {
            env \
              AWS_ACCESS_KEY_ID="$ORACLE_ACCESS_KEY_ID" \
              AWS_SECRET_ACCESS_KEY="$ORACLE_SECRET_ACCESS_KEY" \
              AWS_DEFAULT_REGION="$ORACLE_REGION" \
              AWS_REQUEST_CHECKSUM_CALCULATION="when_required" \
              AWS_RESPONSE_CHECKSUM_VALIDATION="when_required" \
              AWS_EC2_METADATA_DISABLED="true" \
              aws \
                --endpoint-url "$ORACLE_ENDPOINT" \
                "$@"
          }

          local_size="$(stat -c '%s' work/base.qcow2)"

          remote_size="$(
            oracle_aws \
              s3api head-object \
              --bucket "$ORACLE_BUCKET" \
              --key "${OBJECT_PREFIX}/base.qcow2" \
              --query 'ContentLength' \
              --output text
          )"

          echo "Local size:  $local_size bytes"
          echo "Remote size: $remote_size bytes"

          if [[ "$local_size" != "$remote_size" ]]; then
            echo "::error::Oracle object size verification failed"
            exit 1
          fi

          oracle_aws \
            s3 cp \
            "s3://${ORACLE_BUCKET}/${OBJECT_PREFIX}/base.sha256" \
            "work/oracle-base.sha256" \
            --only-show-errors

          expected="$(awk 'NF {print $1; exit}' work/base.sha256)"
          oracle_checksum="$(awk 'NF {print $1; exit}' work/oracle-base.sha256)"

          if [[ "$expected" != "$oracle_checksum" ]]; then
            echo "::error::Oracle checksum sidecar verification failed"
            exit 1
          fi

          oracle_aws \
            s3api head-object \
            --bucket "$ORACLE_BUCKET" \
            --key "${OBJECT_PREFIX}/base.qcow2" \
            --output json

          echo "============================================================"
          echo "COPY COMPLETED SUCCESSFULLY"
          echo
          echo "Source:"
          echo "  s3://${B2_BUCKET}/${OBJECT_PREFIX}/base.qcow2"
          echo
          echo "Oracle destination:"
          echo "  s3://${ORACLE_BUCKET}/${OBJECT_PREFIX}/base.qcow2"
          echo
          echo "SHA256:"
          echo "  ${expected}"
          echo "============================================================"
