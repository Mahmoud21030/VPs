name: build-base-image-vnc

on:
  workflow_dispatch:
    inputs:
      storage_provider:
        description: Object storage provider
        required: true
        default: backblaze
        type: choice
        options:
          - backblaze
          - oracle
      windows_iso_url:
        description: Direct HTTPS URL to Windows ISO
        required: true
        type: string

      virtio_iso_url:
        description: Direct HTTPS URL to virtio-win ISO
        required: true
        default: https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/stable-virtio/virtio-win.iso
        type: string

      disk_size:
        description: Virtual Windows disk size, must be above 80G (example 220G)
        required: false
        default: 220G
        type: string

      memory_mb:
        description: VM memory in MB
        required: false
        default: "8192"
        type: string

      cpu_cores:
        description: Number of virtual CPU cores
        required: false
        default: "4"
        type: string

      install_timeout_minutes:
        description: Maximum time to wait for manual Windows installation and shutdown
        required: false
        default: "210"
        type: string

      windows_iso_sha256:
        description: Optional SHA256 of Windows ISO
        required: false
        default: ""
        type: string

      virtio_iso_sha256:
        description: Optional SHA256 of VirtIO ISO
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: windows-vm-storage
  cancel-in-progress: false

jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      STORAGE_PROVIDER: ${{ inputs.storage_provider || vars.STORAGE_PROVIDER || 'backblaze' }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_REGION: ${{ secrets.B2_REGION }}
      ORACLE_BUCKET: ${{ secrets.ORACLE_BUCKET }}
      ORACLE_NAMESPACE: ${{ secrets.ORACLE_NAMESPACE }}
      ORACLE_REGION: ${{ secrets.ORACLE_REGION }}
      ORACLE_ENDPOINT: ${{ secrets.ORACLE_ENDPOINT }}
      ORACLE_ACCESS_KEY_ID: ${{ secrets.ORACLE_ACCESS_KEY_ID }}
      ORACLE_SECRET_ACCESS_KEY: ${{ secrets.ORACLE_SECRET_ACCESS_KEY }}

      # AWS CLI v2 compatibility for OCI/S3-compatible multipart uploads.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - name: Show runner CPU RAM and disk specifications
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "RUNNER SPECIFICATIONS"
          echo "============================================================"

          echo
          echo "=== OPERATING SYSTEM ==="
          uname -a
          cat /etc/os-release || true

          echo
          echo "=== CPU ==="
          echo "Logical CPUs: $(nproc)"
          lscpu

          echo
          echo "=== RAM ==="
          free -h
          grep -E 'MemTotal|MemAvailable|SwapTotal|SwapFree' /proc/meminfo || true

          echo
          echo "=== BLOCK DEVICES ==="
          lsblk -o NAME,TYPE,SIZE,FSTYPE,FSAVAIL,MOUNTPOINTS || true

          echo
          echo "=== FILESYSTEM SPACE ==="
          df -hT

          echo
          echo "=== RAW FILESYSTEM SPACE IN BYTES ==="
          df -B1 -P

          {
            echo "### Runner specifications"
            echo
            echo "- Logical CPUs: \`$(nproc)\`"
            echo "- RAM: \`$(free -h | awk '/^Mem:/ {print $2}')\`"
            echo
            echo '```text'
            df -hT
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Use largest writable filesystem for VM files
        shell: bash
        run: scripts/bootstrap/prepare-work-drive.sh

      - name: Validate requested virtual disk size
        shell: bash
        env:
          DISK_SIZE: ${{ inputs.disk_size }}
        run: |
          set -Eeuo pipefail

          if [[ ! "$DISK_SIZE" =~ ^[0-9]+G$ ]]; then
            echo "::error::disk_size must use whole GiB syntax such as 220G"
            exit 1
          fi

          disk_gib="${DISK_SIZE%G}"

          if (( disk_gib <= 80 )); then
            echo "::error::disk_size must be above 80G"
            exit 1
          fi

          echo "Requested Windows virtual disk size: $DISK_SIZE"

      - name: Install dependencies
        run: scripts/bootstrap/install.sh

      - name: Enable KVM access
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -e /dev/kvm ]]; then
            echo "::error::/dev/kvm is not available on this runner"
            exit 1
          fi

          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "::error::Current runner user cannot access /dev/kvm"
            exit 1
          fi

      - name: Authenticate selected object storage
        run: scripts/storage/login

      - name: Connect runner to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Get Tailscale VNC address
        id: vnc
        shell: bash
        run: |
          set -Eeuo pipefail

          TS_IP="$(tailscale ip -4 | head -n 1)"
          if [[ -z "$TS_IP" ]]; then
            echo "::error::Could not determine Tailscale IPv4 address"
            exit 1
          fi

          echo "tailscale_ip=$TS_IP" >> "$GITHUB_OUTPUT"
          echo "VM_BIND_ADDRESS=$TS_IP" >> "$GITHUB_ENV"
          echo "VNC address will be: ${TS_IP}:5900"
          tailscale status

      - name: Build Windows base image with interactive VNC console
        shell: bash
        env:
          WINDOWS_ISO_URL: ${{ inputs.windows_iso_url }}
          VIRTIO_ISO_URL: ${{ inputs.virtio_iso_url }}
          WINDOWS_ISO_SHA256: ${{ inputs.windows_iso_sha256 }}
          VIRTIO_ISO_SHA256: ${{ inputs.virtio_iso_sha256 }}
          DISK_SIZE: ${{ inputs.disk_size }}
          MEMORY_MB: ${{ inputs.memory_mb }}
          CPU_CORES: ${{ inputs.cpu_cores }}
          INSTALL_TIMEOUT_MINUTES: ${{ inputs.install_timeout_minutes }}
          VM_BIND_ADDRESS: ${{ steps.vnc.outputs.tailscale_ip }}
        run: |
          set -Eeuo pipefail

          if [[ ! "$MEMORY_MB" =~ ^[0-9]+$ ]] || (( MEMORY_MB < 2048 || MEMORY_MB > 65536 )); then
            echo "::error::memory_mb must be an integer from 2048 through 65536"
            exit 1
          fi
          if [[ ! "$CPU_CORES" =~ ^[0-9]+$ ]] || (( CPU_CORES < 1 || CPU_CORES > 16 )); then
            echo "::error::cpu_cores must be an integer from 1 through 16"
            exit 1
          fi
          if [[ ! "$INSTALL_TIMEOUT_MINUTES" =~ ^[0-9]+$ ]] || (( INSTALL_TIMEOUT_MINUTES < 15 || INSTALL_TIMEOUT_MINUTES > 225 )); then
            echo "::error::install_timeout_minutes must be an integer from 15 through 225"
            exit 1
          fi

          echo "Storage provider: $STORAGE_PROVIDER"
          echo "Starting QEMU base-image builder"
          echo "VNC address: ${{ steps.vnc.outputs.tailscale_ip }}:5900"
          echo "Install Windows manually, then shut Windows down normally."

          scripts/qemu/build-base \
            --windows-iso-url "$WINDOWS_ISO_URL" \
            --virtio-iso-url "$VIRTIO_ISO_URL" \
            --windows-iso-sha256 "$WINDOWS_ISO_SHA256" \
            --virtio-iso-sha256 "$VIRTIO_ISO_SHA256" \
            --disk-size "$DISK_SIZE" \
            --memory-mb "$MEMORY_MB" \
            --cpu-cores "$CPU_CORES" \
            --install-timeout-minutes "$INSTALL_TIMEOUT_MINUTES" &

          BUILD_PID=$!

          echo "Waiting for VNC server on TCP 5900..."
          for _ in $(seq 1 180); do
            if ss -ltn | grep -q ':5900 '; then
              echo "============================================================"
              echo "VNC SERVER READY"
              echo "Address: ${{ steps.vnc.outputs.tailscale_ip }}:5900"
              echo "============================================================"
              ss -ltnp | grep ':5900' || true
              break
            fi

            if ! kill -0 "$BUILD_PID" 2>/dev/null; then
              echo "::error::Base-image builder exited before VNC became ready"
              wait "$BUILD_PID"
              exit $?
            fi

            sleep 2
          done

          if ! ss -ltn | grep -q ':5900 '; then
            echo "::error::VNC server did not become ready"
            wait "$BUILD_PID" || true
            exit 1
          fi

          wait "$BUILD_PID"

      - name: Upload base image to selected object storage
        run: scripts/storage/upload-base

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: base-image-logs
          if-no-files-found: ignore
          path: |
            logs/*.log
            work/base.sha256
            work/base-manifest.json
