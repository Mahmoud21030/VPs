name: maintenance
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'
concurrency:
  group: windows-vm-maintenance
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/bootstrap/install.sh
      - run: scripts/backblaze/login
      - run: scripts/restore/restore
      - run: qemu-img check work/overlay.qcow2
      - run: scripts/verify/sha256 work/overlay.qcow2.zst work/overlay.sha256
