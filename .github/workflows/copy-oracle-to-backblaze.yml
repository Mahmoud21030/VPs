name: Copy Oracle VM to Backblaze

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest

    env:
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd jq

      - name: Configure Oracle credentials
        run: |
          set -Eeuo pipefail

          mkdir -p ~/.aws

          cat > ~/.aws/config <<EOF
          [default]
          request_checksum_calculation = when_required
          response_checksum_validation = when_required

          s3 =
            addressing_style = path
            signature_version = s3v4
          EOF

          cat > ~/.aws/credentials <<EOF
          [default]
          aws_access_key_id=${{ secrets.ORACLE_ACCESS_KEY_ID }}
          aws_secret_access_key=${{ secrets.ORACLE_SECRET_ACCESS_KEY }}
          EOF

      - name: Download from Oracle
        env:
          ENDPOINT: ${{ secrets.ORACLE_ENDPOINT }}
          BUCKET: ${{ secrets.ORACLE_BUCKET }}
        run: |
          set -Eeuo pipefail

          mkdir vm

          aws \
            --endpoint-url "$ENDPOINT" \
            s3 cp \
            s3://$BUCKET/windows-vm/base.qcow2 \
            vm/base.qcow2

          aws \
            --endpoint-url "$ENDPOINT" \
            s3 cp \
            s3://$BUCKET/windows-vm/latest/overlay.qcow2.zst \
            vm/overlay.qcow2.zst

          aws \
            --endpoint-url "$ENDPOINT" \
            s3 cp \
            s3://$BUCKET/windows-vm/latest/overlay.sha256 \
            vm/overlay.sha256

          aws \
            --endpoint-url "$ENDPOINT" \
            s3 cp \
            s3://$BUCKET/windows-vm/latest/manifest.json \
            vm/manifest.json

      - name: Verify downloaded overlay
        run: |
          set -Eeuo pipefail
          cd vm
          sha256sum -c overlay.sha256

      - name: Configure Backblaze credentials
        run: |
          set -Eeuo pipefail

          cat > ~/.aws/credentials <<EOF
          [default]
          aws_access_key_id=${{ secrets.B2_KEY_ID }}
          aws_secret_access_key=${{ secrets.B2_APPLICATION_KEY }}
          EOF

      - name: Upload to Backblaze
        env:
          ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          set -Eeuo pipefail

          aws \
            --endpoint-url "$ENDPOINT" \
            s3 cp vm/base.qcow2 \
            s3://$BUCKET/windows-vm/base.qcow2

          aws \
            --endpoint-url "$ENDPOINT" \
            s3 cp vm/overlay.qcow2.zst \
            s3://$BUCKET/windows-vm/latest/overlay.qcow2.zst

          aws \
            --endpoint-url "$ENDPOINT" \
            s3 cp vm/overlay.sha256 \
            s3://$BUCKET/windows-vm/latest/overlay.sha256

          aws \
            --endpoint-url "$ENDPOINT" \
            s3 cp vm/manifest.json \
            s3://$BUCKET/windows-vm/latest/manifest.json

      - name: Verify upload
        env:
          ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          set -Eeuo pipefail

          mkdir verify

          aws \
            --endpoint-url "$ENDPOINT" \
            s3 cp \
            s3://$BUCKET/windows-vm/latest/overlay.qcow2.zst \
            verify/overlay.qcow2.zst

          cp vm/overlay.sha256 verify/

          (
            cd verify
            sha256sum -c overlay.sha256
          )

          echo
          echo "====================================="
          echo "Base copied successfully."
          echo "Latest overlay verified successfully."
          echo "Migration completed successfully."
          echo "====================================="
