name: runtime

on:
  workflow_dispatch:
    inputs:
      storage_provider:
        description: Object storage provider
        required: true
        default: backblaze
        type: choice
        options:
          - backblaze
          - oracle
      memory_mb:
        description: VM memory in MB
        required: false
        default: "8192"
        type: string
      cpu_cores:
        description: Number of virtual CPU cores
        required: false
        default: "4"
        type: string

      disk_size:
        description: Virtual Windows disk size, must be above 80G (example 220G)
        required: false
        default: 220G
        type: string

      checkpoint_interval_minutes:
        description: Automatic checkpoint interval in minutes
        required: false
        default: "15"
        type: string

      virtio_iso_url:
        description: Direct HTTPS URL to the VirtIO Windows driver ISO
        required: false
        default: https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/stable-virtio/virtio-win.iso
        type: string

      virtio_iso_sha256:
        description: Optional SHA256 checksum for the VirtIO ISO
        required: false
        default: ""
        type: string

concurrency:
  group: windows-vm-runtime
  cancel-in-progress: false

jobs:
  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      STORAGE_PROVIDER: ${{ inputs.storage_provider || vars.STORAGE_PROVIDER || 'backblaze' }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_REGION: ${{ secrets.B2_REGION }}
      ORACLE_BUCKET: ${{ secrets.ORACLE_BUCKET }}
      ORACLE_NAMESPACE: ${{ secrets.ORACLE_NAMESPACE }}
      ORACLE_REGION: ${{ secrets.ORACLE_REGION }}
      ORACLE_ENDPOINT: ${{ secrets.ORACLE_ENDPOINT }}
      ORACLE_ACCESS_KEY_ID: ${{ secrets.ORACLE_ACCESS_KEY_ID }}
      ORACLE_SECRET_ACCESS_KEY: ${{ secrets.ORACLE_SECRET_ACCESS_KEY }}

      # AWS CLI v2 compatibility for OCI/S3-compatible multipart uploads.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - name: Show runner CPU RAM and disk specifications
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "RUNNER SPECIFICATIONS"
          echo "============================================================"

          echo
          echo "=== OPERATING SYSTEM ==="
          uname -a
          cat /etc/os-release || true

          echo
          echo "=== CPU ==="
          echo "Logical CPUs: $(nproc)"
          lscpu

          echo
          echo "=== RAM ==="
          free -h
          grep -E 'MemTotal|MemAvailable|SwapTotal|SwapFree' /proc/meminfo || true

          echo
          echo "=== BLOCK DEVICES ==="
          lsblk -o NAME,TYPE,SIZE,FSTYPE,FSAVAIL,MOUNTPOINTS || true

          echo
          echo "=== FILESYSTEM SPACE ==="
          df -hT

          echo
          echo "=== RAW FILESYSTEM SPACE IN BYTES ==="
          df -B1 -P

          {
            echo "### Runner specifications"
            echo
            echo "- Logical CPUs: \`$(nproc)\`"
            echo "- RAM: \`$(free -h | awk '/^Mem:/ {print $2}')\`"
            echo
            echo '```text'
            df -hT
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use largest writable filesystem for VM files
        shell: bash
        run: scripts/bootstrap/prepare-work-drive.sh

      - name: Configure runtime resources and virtual disk size
        shell: bash
        env:
          MEMORY_MB: ${{ inputs.memory_mb }}
          CPU_CORES: ${{ inputs.cpu_cores }}
          DISK_SIZE: ${{ inputs.disk_size }}
        run: |
          set -Eeuo pipefail

          if [[ ! "$MEMORY_MB" =~ ^[0-9]+$ ]] || (( MEMORY_MB < 1024 )); then
            echo "::error::memory_mb must be an integer of at least 1024"
            exit 1
          fi

          if [[ ! "$CPU_CORES" =~ ^[0-9]+$ ]] || (( CPU_CORES < 1 )); then
            echo "::error::cpu_cores must be a positive integer"
            exit 1
          fi

          if [[ ! "$DISK_SIZE" =~ ^[0-9]+G$ ]]; then
            echo "::error::disk_size must use whole GiB syntax such as 220G"
            exit 1
          fi

          disk_gib="${DISK_SIZE%G}"

          if (( disk_gib <= 80 )); then
            echo "::error::disk_size must be above 80G"
            exit 1
          fi

          jq \
            --arg disk_size "$DISK_SIZE" \
            '.memory_mb=($ENV.MEMORY_MB|tonumber)
             | .cpu_cores=($ENV.CPU_CORES|tonumber)
             | .disk_size=$disk_size' \
            config/vm.json > config/vm.json.tmp

          mv config/vm.json.tmp config/vm.json

          echo "Configured VM:"
          jq '{memory_mb, cpu_cores, disk_size}' config/vm.json

      - name: Install dependencies
        run: scripts/bootstrap/install.sh

      - name: Enable KVM access
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -e /dev/kvm ]]; then
            echo "::error::/dev/kvm is not available on this runner"
            exit 1
          fi

          sudo chmod 666 /dev/kvm

          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "::error::Current runner user cannot access /dev/kvm"
            exit 1
          fi

          ls -l /dev/kvm
          echo "KVM access enabled successfully"

      - name: Authenticate selected object storage
        run: scripts/storage/login

      - name: Remove old rotated checkpoints and reclaim storage
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/libvm.py prune-old-checkpoints

      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Get Tailscale connection information
        id: tailscale
        shell: bash
        run: |
          set -Eeuo pipefail

          TS_IP="$(tailscale ip -4 | head -n 1)"

          if [[ -z "$TS_IP" ]]; then
            echo "::error::Could not determine the Tailscale IPv4 address"
            exit 1
          fi

          echo "ip=$TS_IP" >> "$GITHUB_OUTPUT"

          {
            echo "### Windows VM connection"
            echo
            echo "- **RDP:** \`${TS_IP}:3389\`"
            echo "- **Emergency VNC console:** \`${TS_IP}:5900\`"
            echo "- VNC authentication: none"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "============================================================"
          echo "Storage provider: $STORAGE_PROVIDER"
          echo "WINDOWS VM CONNECTION INFORMATION"
          echo
          echo "RDP: ${TS_IP}:3389"
          echo "VNC: ${TS_IP}:5900"
          echo
          echo "Use RDP for normal work."
          echo "Use VNC for boot, recovery, driver, or RDP problems."
          echo "============================================================"

          tailscale status

      - name: Restore persistent VM
        run: scripts/restore/restore

      - name: Download VirtIO driver ISO
        shell: bash
        env:
          VIRTIO_ISO_URL: ${{ inputs.virtio_iso_url }}
          VIRTIO_ISO_SHA256: ${{ inputs.virtio_iso_sha256 }}
        run: |
          set -Eeuo pipefail

          mkdir -p work

          final_path="work/virtio-win.iso"
          temp_path="${final_path}.part"

          rm -f "$temp_path"

          echo "Downloading VirtIO Windows driver ISO..."

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            --progress-bar \
            "$VIRTIO_ISO_URL" \
            --output "$temp_path"

          if [[ -n "${VIRTIO_ISO_SHA256:-}" ]]; then
            expected="$(printf '%s' "$VIRTIO_ISO_SHA256" | tr '[:upper:]' '[:lower:]')"

            if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::virtio_iso_sha256 must contain exactly 64 hexadecimal characters"
              exit 1
            fi

            actual="$(sha256sum "$temp_path" | awk '{print $1}')"

            echo "Expected SHA256: $expected"
            echo "Actual SHA256:   $actual"

            if [[ "$actual" != "$expected" ]]; then
              echo "::error::VirtIO ISO SHA256 verification failed"
              exit 1
            fi
          fi

          mv "$temp_path" "$final_path"

          echo "VirtIO ISO ready:"
          ls -lh "$final_path"

      - name: Boot Windows VM
        run: scripts/qemu/boot

      - name: Wait for VNC console
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Waiting for QEMU VNC console on local port 5900..."

          for attempt in $(seq 1 90); do
            if nc -z 127.0.0.1 5900 2>/dev/null; then
              echo "============================================================"
              echo "VNC CONSOLE READY"
              echo "Connect to: ${{ steps.tailscale.outputs.ip }}:5900"
              echo "============================================================"
              ss -ltnp | grep ':5900' || true
              exit 0
            fi

            if [[ -f work/qemu.pid ]]; then
              QEMU_PID="$(cat work/qemu.pid)"
              if ! kill -0 "$QEMU_PID" 2>/dev/null; then
                echo "::error::QEMU exited before the VNC console became ready"
                tail -n 200 work/qemu.log 2>/dev/null || true
                exit 1
              fi
            fi

            sleep 2
          done

          echo "::error::VNC console did not become ready within 180 seconds"
          tail -n 200 work/qemu.log 2>/dev/null || true
          exit 1

      - name: Wait for Windows RDP
        id: rdp
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Waiting up to 15 minutes for Windows RDP..."
          python3 scripts/libvm.py wait-rdp --timeout 900

      - name: Show connection status
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "WINDOWS VM CONNECTION STATUS"
          echo
          echo "VNC: ${{ steps.tailscale.outputs.ip }}:5900"
          echo "RDP: ${{ steps.tailscale.outputs.ip }}:3389"
          echo

          if [[ "${{ steps.rdp.outcome }}" == "success" ]]; then
            echo "RDP is ready."
          else
            echo "WARNING: RDP is not ready."
            echo "The workflow will remain running."
            echo "Use VNC to inspect or repair Windows."
          fi

          echo "============================================================"

      - name: Configure automatic checkpoint interval
        shell: bash
        env:
          CHECKPOINT_INTERVAL_MINUTES: ${{ inputs.checkpoint_interval_minutes }}
        run: |
          set -Eeuo pipefail

          if [[ ! "$CHECKPOINT_INTERVAL_MINUTES" =~ ^[0-9]+$ ]]; then
            echo "::error::checkpoint_interval_minutes must be a positive integer"
            exit 1
          fi

          if (( CHECKPOINT_INTERVAL_MINUTES < 1 )); then
            echo "::error::checkpoint_interval_minutes must be at least 1"
            exit 1
          fi

          jq \
            --argjson interval "$CHECKPOINT_INTERVAL_MINUTES" \
            '.interval_minutes=$interval' \
            config/checkpoint.json > config/checkpoint.json.tmp

          mv config/checkpoint.json.tmp config/checkpoint.json

          echo "Automatic checkpoint interval: ${CHECKPOINT_INTERVAL_MINUTES} minute(s)"
          cat config/checkpoint.json

      - name: Start checkpoint loop
        shell: bash
        run: |
          set -Eeuo pipefail

          nohup scripts/checkpoint/loop \
            > logs/checkpoint-loop.log 2>&1 &

          echo $! > work/checkpoint-loop.pid
          echo "Checkpoint loop started with PID $(cat work/checkpoint-loop.pid)"

      - name: Keep runtime alive until Windows shuts down
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "============================================================"
          echo "VM IS RUNNING"
          echo
          echo "RDP: ${{ steps.tailscale.outputs.ip }}:3389"
          echo "VNC: ${{ steps.tailscale.outputs.ip }}:5900"
          echo
          echo "When Windows shuts down normally, the workflow will:"
          echo "  1. Detect that QEMU exited"
          echo "  2. Create an offline checkpoint"
          echo "  3. Upload and verify latest persistent state"
          echo "============================================================"

          while true; do
            sleep 15

            QEMU_PID="$(cat work/qemu.pid 2>/dev/null || true)"

            if [[ -z "$QEMU_PID" ]]; then
              echo "QEMU PID file disappeared after Windows shutdown."
              echo "Runtime is ending normally so cleanup can save the stopped overlay."
              exit 0
            fi

            if ! kill -0 "$QEMU_PID" 2>/dev/null; then
              echo "QEMU process $QEMU_PID has exited."
              echo "Runtime is ending normally so cleanup can save the stopped overlay."
              exit 0
            fi
          done

      - name: Save final checkpoint after shutdown or workflow exit
        if: always()
        timeout-minutes: 90
        run: scripts/cleanup/cleanup

      - name: Upload runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-logs
          if-no-files-found: ignore
          path: |
            logs/*.log
            work/qemu.log
