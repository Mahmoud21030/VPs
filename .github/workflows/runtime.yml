name: runtime

on:
  workflow_dispatch:
    inputs:
      storage_provider:
        description: Object storage provider
        required: true
        default: backblaze
        type: choice
        options:
          - backblaze
          - oracle
      network_provider:
        description: Private connectivity or authenticated relay provider
        required: true
        default: tailscale
        type: choice
        options:
          - tailscale
          - cloudflare
          - ssh-relay
      cloudflare_rdp_hostname:
        description: Cloudflare Access TCP hostname routed to tcp://127.0.0.1:3389
        required: false
        default: ""
        type: string
      cloudflare_vnc_hostname:
        description: Cloudflare Access TCP hostname routed to tcp://127.0.0.1:5900
        required: false
        default: ""
        type: string
      ssh_relay_host:
        description: SSH VPS or bastion hostname for reverse forwarding
        required: false
        default: ""
        type: string
      ssh_relay_user:
        description: SSH relay login user
        required: false
        default: ""
        type: string
      ssh_relay_port:
        description: SSH relay server port
        required: false
        default: "22"
        type: string
      ssh_relay_rdp_port:
        description: Loopback-only RDP port created on the SSH relay
        required: false
        default: "13389"
        type: string
      ssh_relay_vnc_port:
        description: Loopback-only VNC port created on the SSH relay
        required: false
        default: "15900"
        type: string
      memory_mb:
        description: VM memory in MB
        required: false
        default: "15360"
        type: string
      cpu_cores:
        description: Number of virtual CPU cores
        required: false
        default: "4"
        type: string
      disk_size:
        description: Sparse virtual disk size (whole GiB, strictly above 80G)
        required: false
        default: 220G
        type: string
      checkpoint_interval_minutes:
        description: Positive integer interval between completed checkpoints
        required: false
        default: "15"
        type: string
      compression_level:
        description: zstd level 1-22 (10 recommended; levels above 19 use --ultra)
        required: false
        default: "10"
        type: string
      forced_save_after_minutes:
        description: Force a verified final save this many minutes after job start
        required: false
        default: "300"
        type: string
      allow_fresh_overlay_if_missing:
        description: Explicitly allow a blank overlay when latest cannot be restored
        required: false
        default: false
        type: boolean
      virtio_iso_url:
        description: Direct HTTPS URL to the VirtIO Windows driver ISO
        required: false
        default: https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/stable-virtio/virtio-win.iso
        type: string
      virtio_iso_sha256:
        description: Optional SHA256 checksum for the VirtIO ISO
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: windows-vm-storage
  cancel-in-progress: false

jobs:
  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      STORAGE_PROVIDER: ${{ inputs.storage_provider || vars.STORAGE_PROVIDER || 'backblaze' }}
      NETWORK_PROVIDER: ${{ inputs.network_provider || 'tailscale' }}
      ALLOW_FRESH_OVERLAY_IF_MISSING: ${{ inputs.allow_fresh_overlay_if_missing }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_REGION: ${{ secrets.B2_REGION }}
      ORACLE_BUCKET: ${{ secrets.ORACLE_BUCKET }}
      ORACLE_NAMESPACE: ${{ secrets.ORACLE_NAMESPACE }}
      ORACLE_REGION: ${{ secrets.ORACLE_REGION }}
      ORACLE_ENDPOINT: ${{ secrets.ORACLE_ENDPOINT }}
      ORACLE_ACCESS_KEY_ID: ${{ secrets.ORACLE_ACCESS_KEY_ID }}
      ORACLE_SECRET_ACCESS_KEY: ${{ secrets.ORACLE_SECRET_ACCESS_KEY }}
      CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
      SSH_RELAY_PRIVATE_KEY: ${{ secrets.SSH_RELAY_PRIVATE_KEY }}
      SSH_RELAY_KNOWN_HOSTS: ${{ secrets.SSH_RELAY_KNOWN_HOSTS }}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - name: Show runner operating system CPU RAM swap and storage
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "WORKFLOW_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

          echo "============================================================"
          echo "RUNNER SPECIFICATIONS"
          echo "============================================================"
          echo "=== OPERATING SYSTEM ==="
          uname -a
          cat /etc/os-release
          echo "=== CPU MODEL AND LOGICAL CPU COUNT ==="
          lscpu
          echo "Logical CPU count: $(nproc)"
          echo "=== RAM AND SWAP ==="
          free -h
          grep -E 'MemTotal|MemAvailable|SwapTotal|SwapFree' /proc/meminfo
          echo "=== BLOCK DEVICES FILESYSTEMS AND MOUNT POINTS ==="
          lsblk -o NAME,TYPE,SIZE,FSTYPE,FSAVAIL,MOUNTPOINTS
          echo "=== FILESYSTEM TYPES AND AVAILABLE SPACE ==="
          df -hT
          echo "=== RAW AVAILABLE BYTES ==="
          df -B1 -P

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Use largest writable filesystem for physical VM files
        shell: bash
        run: scripts/bootstrap/prepare-work-drive.sh

      - name: Validate and configure runtime inputs
        shell: bash
        env:
          MEMORY_MB: ${{ inputs.memory_mb }}
          CPU_CORES: ${{ inputs.cpu_cores }}
          DISK_SIZE: ${{ inputs.disk_size }}
          CHECKPOINT_INTERVAL_MINUTES: ${{ inputs.checkpoint_interval_minutes }}
          COMPRESSION_LEVEL: ${{ inputs.compression_level }}
          FORCED_SAVE_AFTER_MINUTES: ${{ inputs.forced_save_after_minutes }}
        run: |
          set -Eeuo pipefail

          if [[ ! "$MEMORY_MB" =~ ^[0-9]+$ ]] || (( MEMORY_MB < 2048 || MEMORY_MB > 65536 )); then
            echo "::error::memory_mb must be an integer from 2048 through 65536"
            exit 1
          fi
          if [[ ! "$CPU_CORES" =~ ^[0-9]+$ ]] || (( CPU_CORES < 1 || CPU_CORES > 16 )); then
            echo "::error::cpu_cores must be an integer from 1 through 16"
            exit 1
          fi
          if [[ ! "$DISK_SIZE" =~ ^[0-9]+G$ ]]; then
            echo "::error::disk_size must use whole GiB syntax such as 220G"
            exit 1
          fi
          disk_gib="${DISK_SIZE%G}"
          if (( disk_gib <= 80 )); then
            echo "::error::disk_size must be strictly above 80G"
            exit 1
          fi
          if [[ ! "$CHECKPOINT_INTERVAL_MINUTES" =~ ^[0-9]+$ ]] || (( CHECKPOINT_INTERVAL_MINUTES < 1 )); then
            echo "::error::checkpoint_interval_minutes must be a positive integer"
            exit 1
          fi
          if [[ ! "$COMPRESSION_LEVEL" =~ ^[0-9]+$ ]] || (( COMPRESSION_LEVEL < 1 || COMPRESSION_LEVEL > 22 )); then
            echo "::error::compression_level must be an integer from 1 through 22"
            exit 1
          fi
          if [[ ! "$FORCED_SAVE_AFTER_MINUTES" =~ ^[0-9]+$ ]] || (( FORCED_SAVE_AFTER_MINUTES < 1 )); then
            echo "::error::forced_save_after_minutes must be a positive integer"
            exit 1
          fi
          if (( FORCED_SAVE_AFTER_MINUTES > 330 )); then
            echo "::error::forced_save_after_minutes must be 330 or less so the save starts before the 360-minute hosted-job limit"
            exit 1
          fi

          jq \
            --arg memory_mb "$MEMORY_MB" \
            --arg cpu_cores "$CPU_CORES" \
            --arg disk_size "$DISK_SIZE" \
            '.memory_mb=($memory_mb|tonumber) | .cpu_cores=($cpu_cores|tonumber) | .disk_size=$disk_size' \
            config/vm.json > config/vm.json.tmp
          mv config/vm.json.tmp config/vm.json

          jq \
            --arg interval "$CHECKPOINT_INTERVAL_MINUTES" \
            --arg level "$COMPRESSION_LEVEL" \
            --arg forced "$FORCED_SAVE_AFTER_MINUTES" \
            '.interval_minutes=($interval|tonumber) | .compression_level=($level|tonumber) | .forced_save_after_minutes=($forced|tonumber)' \
            config/checkpoint.json > config/checkpoint.json.tmp
          mv config/checkpoint.json.tmp config/checkpoint.json

          echo "Configured VM and persistence policy:"
          jq '{memory_mb,cpu_cores,disk_size}' config/vm.json
          jq '{interval_minutes,compression_level,forced_save_after_minutes}' config/checkpoint.json
          echo "Fresh overlay authorization: $ALLOW_FRESH_OVERLAY_IF_MISSING"
          echo "Higher zstd levels can create smaller files but require more CPU, RAM, and time."
          echo "Levels 20-22 enable --ultra. Levels 19 or 22 may not finish before workflow termination."
          echo "Level 10 is the safer storage-versus-time balance; compression must finish before upload begins."

      - name: Install host dependencies
        run: scripts/bootstrap/install.sh

      - name: Enable KVM access
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::/dev/kvm is not available on this ubuntu-latest runner"
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm -a -w /dev/kvm
          ls -l /dev/kvm

      - name: Authenticate selected object storage
        run: scripts/storage/login

      - name: Delete only obsolete checkpoint objects
        run: python3 scripts/libvm.py prune-old-checkpoints

      - name: Connect runner to Tailscale
        if: inputs.network_provider == 'tailscale'
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Start selected private network or relay
        id: network
        shell: bash
        env:
          CLOUDFLARE_RDP_HOSTNAME: ${{ inputs.cloudflare_rdp_hostname }}
          CLOUDFLARE_VNC_HOSTNAME: ${{ inputs.cloudflare_vnc_hostname }}
          SSH_RELAY_HOST: ${{ inputs.ssh_relay_host }}
          SSH_RELAY_USER: ${{ inputs.ssh_relay_user }}
          SSH_RELAY_PORT: ${{ inputs.ssh_relay_port }}
          SSH_RELAY_RDP_PORT: ${{ inputs.ssh_relay_rdp_port }}
          SSH_RELAY_VNC_PORT: ${{ inputs.ssh_relay_vnc_port }}
        run: scripts/network/setup

      - name: Show RDP and emergency VNC connection instructions
        shell: bash
        env:
          CLOUDFLARE_RDP_HOSTNAME: ${{ inputs.cloudflare_rdp_hostname }}
          CLOUDFLARE_VNC_HOSTNAME: ${{ inputs.cloudflare_vnc_hostname }}
          SSH_RELAY_HOST: ${{ inputs.ssh_relay_host }}
          SSH_RELAY_USER: ${{ inputs.ssh_relay_user }}
          SSH_RELAY_PORT: ${{ inputs.ssh_relay_port }}
          SSH_RELAY_RDP_PORT: ${{ inputs.ssh_relay_rdp_port }}
          SSH_RELAY_VNC_PORT: ${{ inputs.ssh_relay_vnc_port }}
        run: |
          set -Eeuo pipefail
          case "$NETWORK_PROVIDER" in
            tailscale)
              address="${{ steps.network.outputs.address }}"
              instructions="RDP: ${address}:3389 | Emergency VNC: ${address}:5900"
              ;;
            cloudflare)
              instructions="Run cloudflared access tcp --hostname ${CLOUDFLARE_RDP_HOSTNAME} --url localhost:13389 for RDP, and use local port 15900 with ${CLOUDFLARE_VNC_HOSTNAME} for VNC"
              ;;
            ssh-relay)
              instructions="On your client run: ssh -p ${SSH_RELAY_PORT} -N -L 13389:127.0.0.1:${SSH_RELAY_RDP_PORT} -L 15900:127.0.0.1:${SSH_RELAY_VNC_PORT} ${SSH_RELAY_USER}@${SSH_RELAY_HOST}"
              ;;
            *) exit 2 ;;
          esac
          echo "$instructions"
          printf '### Windows VM connection\n\n`%s`\n' "$instructions" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore persistent base and latest overlay
        run: scripts/restore/restore

      - name: Download and verify VirtIO Windows driver ISO
        shell: bash
        env:
          VIRTIO_ISO_URL: ${{ inputs.virtio_iso_url }}
          VIRTIO_ISO_SHA256: ${{ inputs.virtio_iso_sha256 }}
        run: |
          set -Eeuo pipefail
          final_path="work/virtio-win.iso"
          temp_path="${final_path}.part"
          rm -f "$temp_path"
          case "$VIRTIO_ISO_URL" in
            https://*) ;;
            *) echo "::error::virtio_iso_url must be an absolute HTTPS URL"; exit 1 ;;
          esac
          curl \
            --fail \
            --location \
            --connect-timeout 30 \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            --silent \
            --show-error \
            "$VIRTIO_ISO_URL" \
            --output "$temp_path"
          if [[ -n "$VIRTIO_ISO_SHA256" ]]; then
            expected="$(printf '%s' "$VIRTIO_ISO_SHA256" | tr '[:upper:]' '[:lower:]')"
            if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::virtio_iso_sha256 must be exactly 64 hexadecimal characters"
              exit 1
            fi
            actual="$(sha256sum "$temp_path" | awk '{print $1}')"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::VirtIO ISO checksum mismatch: expected=$expected actual=$actual"
              exit 1
            fi
          fi
          mv "$temp_path" "$final_path"
          echo "VirtIO ISO downloaded successfully"
          ls -lh "$final_path"
          echo 'The ISO is mounted read-only. In Windows, use pnputil /add-driver "D:\*.inf" /subdirs /install (the CD drive letter may differ); NetKVM is the key network driver.'

      - name: Boot Windows with QEMU KVM Q35 OVMF and VirtIO
        run: scripts/qemu/boot

      - name: Wait for emergency VNC console
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 90); do
            if nc -z "$VM_BIND_ADDRESS" 5900 2>/dev/null; then
              echo "Emergency VNC listener is ready through $NETWORK_PROVIDER"
              exit 0
            fi
            if [[ -f work/qemu.pid ]]; then
              if ! python3 scripts/libvm.py is-running; then
                echo "::error::QEMU exited before VNC became ready"
                tail -n 200 work/qemu.log || true
                exit 1
              fi
            fi
            sleep 2
          done
          echo "::error::VNC did not become ready within 180 seconds"
          exit 1

      - name: Wait for Windows RDP
        id: rdp
        continue-on-error: true
        run: python3 scripts/libvm.py wait-rdp --timeout 900

      - name: Show Windows connection status
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Connectivity provider: $NETWORK_PROVIDER"
          if [[ "${{ steps.rdp.outcome }}" == "success" ]]; then
            echo "RDP is ready; VNC remains active as the emergency console."
          else
            echo "::warning::RDP is not ready; use VNC to install NetKVM or repair Windows."
          fi

      - name: Run VM with periodic and forced final checkpoints
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f work/checkpoint-loop.stop work/final-checkpoint.done
          scripts/checkpoint/loop \
            > >(tee -a logs/checkpoint-loop.log) 2>&1 &
          LOOP_PID=$!
          for attempt in $(seq 1 50); do
            [[ -f work/checkpoint-loop.pid ]] && break
            sleep 0.1
          done
          if [[ ! -f work/checkpoint-loop.pid ]]; then
            echo "::error::Automatic checkpoint loop failed to start"
            wait "$LOOP_PID"
            exit 1
          fi
          scripts/runtime/supervise
          wait "$LOOP_PID"

      - name: Best-effort finalization after failure or cancellation
        if: always()
        timeout-minutes: 55
        run: scripts/cleanup/cleanup

      - name: Stop selected network or relay
        if: always()
        run: scripts/network/cleanup

      - name: Upload runtime logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-logs
          if-no-files-found: ignore
          path: |
            logs/*.log
            work/qemu.log
